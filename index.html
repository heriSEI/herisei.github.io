<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Sparepart — BAKTI MSS 186</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        :root {
            --bg: #0f1419;
            --bg-card: #1a1f2e;
            --bg-card-2: #21283c;
            --accent: #00d4ff;
            --green: #00d084;
            --yellow: #ffc107;
            --red: #ff5252;
            --orange: #ff9f29;
            --pink: #e84ed6;
            --text: #e6e6e6;
            --muted: #8892a6;
            --border: #2c344b;
        }
        body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { margin-bottom: 24px; text-align: center; }
        h1 { font-size: 24px; color: var(--accent); margin-bottom: 4px; }
        .sub { color: var(--muted); font-size: 14px; margin-bottom: 6px; }
        .refresh-info { font-size: 12px; color: var(--muted); }

        /* KARTU RINGKASAN — Sesuai tampilan aslimu */
        .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 24px; }
        @media (max-width: 1024px) { .cards { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .cards { grid-template-columns: 1fr; } }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            text-align: center;
        }
        .card h3 { font-size: 13px; font-weight: 600; margin-bottom: 8px; padding: 4px 8px; border-radius: 6px; }
        .card .num { font-size: 28px; font-weight: 700; padding: 10px; border-radius: 6px; }

        .card:nth-child(1) h3 { background: var(--green); color: #000; }
        .card:nth-child(1) .num { background: rgba(0,208,132,0.15); color: var(--green); }

        .card:nth-child(2) h3 { background: #4285f4; color: #fff; }
        .card:nth-child(2) .num { background: rgba(66,133,244,0.15); color: #7ab0ff; }

        .card:nth-child(3) h3 { background: var(--orange); color: #000; }
        .card:nth-child(3) .num { background: rgba(255,159,41,0.15); color: var(--orange); }

        .card:nth-child(4) h3 { background: var(--red); color: #fff; }
        .card:nth-child(4) .num { background: rgba(255,82,82,0.15); color: var(--red); }

        .card:nth-child(5) h3 { background: var(--pink); color: #fff; }
        .card:nth-child(5) .num { background: rgba(232,78,214,0.15); color: var(--pink); }

        /* FILTER */
        .filter-bar {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 18px;
            display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
        }
        input, select, button {
            background: var(--bg-card-2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 13px;
        }
        button { background: var(--accent); color: #000; font-weight: 600; cursor: pointer; border: none; }
        button:hover { background: #33e5ff; }

        /* GRAFIK */
        .chart-full, .chart-row { margin-bottom: 24px; }
        .chart-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }
        .chart-box h4 {
            font-size: 15px;
            margin-bottom: 14px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-box h4 span { font-size: 12px; color: var(--muted); font-weight: normal; }
        .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        @media (max-width: 900px) { .chart-row { grid-template-columns: 1fr; } }

        .loading { text-align: center; padding: 40px; color: var(--muted); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📊 DASHBOARD SPAREPART OPERATION BAKTI MSS 186 SITE</h1>
        <p class="sub">PAKET 12 | KSO PT. SEI - AGTI</p>
        <p class="refresh-info" id="refreshInfo">⏳ Mengambil data...</p>
    </header>

    <!-- KARTU RINGKASAN — Sesuai tampilan aslimu -->
    <div class="cards">
        <div class="card"><h3>TOTAL STOCK</h3><div class="num" id="totalStock">—</div></div>
        <div class="card"><h3>STOCK CLUSTER</h3><div class="num" id="stockCluster">—</div></div>
        <div class="card"><h3>REQUEST</h3><div class="num" id="totalRequest">—</div></div>
        <div class="card"><h3>NEED REPLACE</h3><div class="num" id="needReplace">—</div></div>
        <div class="card"><h3>CLAIM MONITORING</h3><div class="num" id="claimMonitoring">—</div></div>
    </div>

    <!-- FILTER -->
    <div class="filter-bar">
        <input type="text" id="search" placeholder="🔍 Cari Part / Site / No. Part...">
        <select id="filterScope"><option value="">Semua Scope</option></select>
        <select id="filterCluster"><option value="">Semua Cluster</option></select>
        <select id="filterRequestStatus"><option value="">Semua Request Status</option></select>
        <select id="filterClaimStatus"><option value="">Semua Claim Status</option></select>
        <button onclick="fetchData()">🔄 Refresh</button>
    </div>

    <!-- 📈 GRAFIK BARU: SEMUA PART YANG STATUS = STOCK -->
    <div class="chart-full">
        <div class="chart-box">
            <h4>📦 SPAREPART STOCK AVAILABILITY <span>(Hanya Usage Status = Stock)</span></h4>
            <canvas id="chartStockPart"></canvas>
        </div>
    </div>

    <!-- GRAFIK TAMBAHAN (tempat nanti) -->
    <div class="chart-row">
        <div class="chart-box">
            <h4>📊 Per Scope</h4>
            <canvas id="chartScope"></canvas>
        </div>
        <div class="chart-box">
            <h4>🔧 Per Status</h4>
            <canvas id="chartStatus"></canvas>
        </div>
    </div>
</div>

<script>
// === KONFIGURASI ===
const SHEET_ID = "1Ciq9oYizelBd85lzz4Qpyqn7q4jZDP1f6sJbI22O_QQ";
const SHEET_NAME = "Raw_File_Update"; // Ubah nama sheet jika perlu
const REFRESH_MINUTES = 3;
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;

let allData = [];
let chartStockPart, chartScope, chartStatus;

// === AMBIL DATA ===
async function fetchData() {
    try {
        document.getElementById("refreshInfo").textContent = `⏳ Mengambil data...`;
        const res = await fetch(URL);
        const txt = await res.text();
        const json = JSON.parse(txt.substr(47).slice(0, -2));

        // Kolom sesuai urutan asli
        const cols = [
            "REQUEST DATE","ALOCATION ID","ALOCATION NAME","KABUPATEN","SCOPE",
            "MATERIAL TYPE","BRAND","PART","RMA No. / PR No.","DESCRIPTION",
            "PART NUMBER","SN","QTY","UOM","REQUEST STATUS",
            "ASSET CONDITION","ORIGIN ID","ORIGIN NAME","DESTINATION ID","DESTINATION NAME",
            "INBOUND DATE","INBOUND STATUS","USAGE STATUS","CURRENT SITE ID","CURRENT SITE NAME",
            "TT BAKTI OSS","DEFECTIVE PART NUMBER","DEFECTIVE SN","INSTALLATION DATE","STATUS REPLACEMENT",
            "COVERAGE TYPE","CLAIM STATUS","CLAIM REPORT DATE","DISPOSITION METHODE","DISPOSITION DATE",
            "DEFECTIVE POSITION ID","DEFECTIVE POSITION NAME","HISTORY TRACKING REMARK"
        ];

        allData = json.table.rows.map(r => {
            let obj = {};
            r.c.forEach((cell, i) => { obj[cols[i]] = cell?.v ?? ""; });
            return obj;
        });

        updateDashboard(allData);
        document.getElementById("refreshInfo").textContent = 
            `✅ Data diperbarui: ${new Date().toLocaleString("id-ID")} · Auto-refresh tiap ${REFRESH_MINUTES} menit`;
    } catch (err) {
        console.error(err);
        document.getElementById("refreshInfo").innerHTML = 
            `❌ Gagal ambil data. Pastikan Sheet sudah di-set publik & nama Sheet benar!<br>Error: ${err.message}`;
    }
}

// === HITUNG KARTU RINGKASAN ===
function updateDashboard(data) {
    // 1. TOTAL STOCK = Usage Status = Stock
    const totalStock = data.filter(r => 
        (r["USAGE STATUS"] || "").toString().trim().toLowerCase().includes("stock")
    ).reduce((sum, r) => sum + (Number(r["QTY"]) || 0), 0);

    // 2. STOCK CLUSTER = sama dengan Total Stock
    const stockCluster = totalStock;

    // 3. REQUEST = jumlah baris / total QTY
    const totalRequest = data.reduce((sum, r) => sum + (Number(r["QTY"]) || 0), 0);

    // 4. NEED REPLACE = Status Replacement berisi Faulty / Force
    const needReplace = data.filter(r => {
        const s = (r["STATUS REPLACEMENT"] || "").toString().trim().toLowerCase();
        return s.includes("faulty") || s.includes("force");
    }).reduce((sum, r) => sum + (Number(r["QTY"]) || 0), 0);

    // 5. CLAIM MONITORING = jumlah data / total QTY
    const claimMonitoring = totalRequest;

    // Tampilkan ke kartu
    document.getElementById("totalStock").textContent = totalStock;
    document.getElementById("stockCluster").textContent = stockCluster;
    document.getElementById("totalRequest").textContent = totalRequest;
    document.getElementById("needReplace").textContent = needReplace;
    document.getElementById("claimMonitoring").textContent = claimMonitoring;

    // Isi pilihan filter
    fillSelect("filterScope", [...new Set(data.map(r => r["SCOPE"]).filter(v => v))].sort());
    fillSelect("filterRequestStatus", [...new Set(data.map(r => r["REQUEST STATUS"]).filter(v => v))].sort());
    fillSelect("filterClaimStatus", [...new Set(data.map(r => r["CLAIM STATUS"]).filter(v => v))].sort());

    // Gambar semua grafik
    drawStockPartChart(data);
    drawScopeChart(data);
    drawStatusChart(data);
}

// === 📈 GRAFIK: SEMUA PART YANG STATUS = STOCK ===
function drawStockPartChart(data) {
    // Filter hanya Usage Status = Stock
    const stockData = data.filter(r => 
        (r["USAGE STATUS"] || "").toString().trim().toLowerCase().includes("stock")
    );

    // Hitung QTY per Nama Part
    const partQty = {};
    stockData.forEach(r => {
        const partName = (r["PART"] || "UNKNOWN").toString().trim() || "UNKNOWN";
        const qty = Number(r["QTY"]) || 0;
        partQty[partName] = (partQty[partName] || 0) + qty;
    });

    // Urutkan dari terbanyak
    const sorted = Object.entries(partQty).sort((a, b) => b[1] - a[1]);
    const labels = sorted.map(item => item[0]);
    const values = sorted.map(item => item[1]);

    // Warna hijau gradasi
    const greenColors = values.map((_, i) => {
        const alpha = 0.4 + ((values[i] / Math.max(...values)) * 0.6);
        return `rgba(0, 208, 132, ${alpha})`;
    });

    if (chartStockPart) chartStockPart.destroy();
    chartStockPart = new Chart(document.getElementById("chartStockPart"), {
        type: "bar",
        data: {
            labels: labels,
            datasets: [{
                label: "Total QTY (Stock)",
                data: values,
                backgroundColor: greenColors,
                borderWidth: 0,
                borderRadius: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: "#1a1f2e",
                    titleColor: "#fff",
                    bodyColor: "#fff",
                    borderColor: "#00d084",
                    borderWidth: 1
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: { color: "#8892a6" },
                    grid: { color: "#2c344b" }
                },
                x: {
                    ticks: { 
                        color: "#8892a6",
                        maxRotation: 60,
                        minRotation: 45
                    },
                    grid: { display: false }
                }
            }
        }
    });
}

// === GRAFIK PER SCOPE ===
function drawScopeChart(data) {
    const scopeQty = {};
    data.forEach(r => {
        const s = (r["SCOPE"] || "Lainnya").trim() || "Lainnya";
        scopeQty[s] = (scopeQty[s] || 0) + (Number(r["QTY"]) || 0);
    });

    if (chartScope) chartScope.destroy();
    chartScope = new Chart(document.getElementById("chartScope"), {
        type: "bar",
        data: {
            labels: Object.keys(scopeQty),
            datasets: [{
                label: "Total QTY",
                data: Object.values(scopeQty),
                backgroundColor: "#00d4ff",
                borderRadius: 4
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                y: { ticks: { color: "#8892a6" }, grid: { color: "#2c344b" } },
                x: { ticks: { color: "#8892a6" }, grid: { display: false } }
            }
        }
    });
}

// === GRAFIK PER STATUS ===
function drawStatusChart(data) {
    const statusQty = {};
    data.forEach(r => {
        const s = (r["USAGE STATUS"] || "Lainnya").trim() || "Lainnya";
        statusQty[s] = (statusQty[s] || 0) + (Number(r["QTY"]) || 0);
    });

    const colors = Object.keys(statusQty).map(k => {
        const l = k.toLowerCase();
        if (l.includes("stock")) return "#00d084";
        if (l.includes("faulty")) return "#ffc107";
        if (l.includes("force")) return "#ff5252";
        return "#8892a6";
    });

    if (chartStatus) chartStatus.destroy();
    chartStatus = new Chart(document.getElementById("chartStatus"), {
        type: "doughnut",
        data: {
            labels: Object.keys(statusQty),
            datasets: [{
                data: Object.values(statusQty),
                backgroundColor: colors,
                borderWidth: 0
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { position: "bottom", labels: { color: "#e6e6e6" } } }
        }
    });
}

function fillSelect(id, arr) {
    const sel = document.getElementById(id);
    const keep = sel.value;
    sel.innerHTML = `<option value="">Semua</option>` +
        arr.map(v => `<option value="${v}">${v}</option>`).join("");
    sel.value = keep;
}

// === MULAI ===
fetchData();
setInterval(fetchData, REFRESH_MINUTES * 60 * 1000);
</script>
</body>
</html>
