<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stok Material — BAKTI MSS 186</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        :root {
            --bg: #0f1419;
            --bg-card: #1a1f2e;
            --bg-card-2: #21283c;
            --accent: #00d4ff;
            --accent-2: #0099ff;
            --green: #00d084;
            --yellow: #ffc107;
            --red: #ff5252;
            --text: #e6e6e6;
            --muted: #8892a6;
            --border: #2c344b;
        }
        body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { margin-bottom: 24px; }
        h1 { font-size: 22px; color: var(--accent); margin-bottom: 4px; }
        .sub { color: var(--muted); font-size: 13px; }
        .refresh-info { font-size: 12px; color: var(--muted); margin-top: 6px; }

        /* KARTU RINGKASAN */
        .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 24px; }
        @media (max-width: 1024px) { .cards { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .cards { grid-template-columns: 1fr; } }
        .card {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-card-2));
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
        }
        .card h3 { font-size: 13px; color: var(--muted); margin-bottom: 8px; font-weight: 500; }
        .card .num { font-size: 28px; font-weight: 700; }
        .card:nth-child(1) .num { color: var(--accent); }
        .card:nth-child(2) .num { color: var(--green); }
        .card:nth-child(3) .num { color: var(--red); }
        .card:nth-child(4) .num { color: var(--yellow); }
        .card:nth-child(5) .num { color: #a855f7; }

        /* FILTER */
        .filter-bar {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 18px;
            display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
        }
        input, select, button {
            background: var(--bg-card-2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 13px;
        }
        button { background: var(--accent); color: #000; font-weight: 600; cursor: pointer; border: none; }
        button:hover { background: #33e5ff; }

        /* GRID KONTEN */
        .content-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 18px; }
        @media (max-width: 900px) { .content-grid { grid-template-columns: 1fr; } }

        /* TABEL */
        .table-wrap {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: var(--bg-card-2); color: var(--accent); font-weight: 600; position: sticky; top: 0; }
        tr:hover { background: rgba(0,212,255,0.04); }
        .status-stock { color: var(--green); font-weight: 500; }
        .status-faulty { color: var(--yellow); }
        .status-force { color: var(--red); }

        /* GRAFIK */
        .chart-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 18px;
        }
        .chart-box h4 { font-size: 14px; margin-bottom: 12px; color: var(--muted); }

        .loading { text-align: center; padding: 40px; color: var(--muted); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📦 Stok Material — BAKTI MSS 186</h1>
        <p class="sub">Sparepart Operation · Transaction Raw Data</p>
        <p class="refresh-info" id="refreshInfo">Mengambil data...</p>
    </header>

    <!-- KARTU RINGKASAN -->
    <div class="cards">
        <div class="card"><h3>TOTAL UNIT</h3><div class="num" id="totalUnit">—</div></div>
        <div class="card"><h3>UNIT DI STOCK</h3><div class="num" id="inStock">—</div></div>
        <div class="card"><h3>PERLU PENGGANTIAN</h3><div class="num" id="needReplace">—</div></div>
        <div class="card"><h3>JENIS PART</h3><div class="num" id="typePart">—</div></div>
        <div class="card"><h3>SITE / GUDANG</h3><div class="num" id="location">—</div></div>
    </div>

    <!-- FILTER & PENCARIAN -->
    <div class="filter-bar">
        <input type="text" id="search" placeholder="🔍 Cari Part / No. Part / Site...">
        <select id="filterScope"><option value="">Semua Scope</option></select>
        <select id="filterBrand"><option value="">Semua Brand</option></select>
        <select id="filterStatus"><option value="">Semua Status</option><option value="Stock">Stock</option><option value="Replacement Faulty">Replacement Faulty</option><option value="Replacement Force Majure">Replacement Force Majure</option></select>
        <button onclick="fetchData()">🔄 Refresh</button>
    </div>

    <div class="content-grid">
        <!-- TABEL DATA -->
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Part</th>
                        <th>Brand</th>
                        <th>Type</th>
                        <th>Scope</th>
                        <th>Part Number</th>
                        <th>QTY</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="7" class="loading">Memuat data dari Google Sheets...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- GRAFIK -->
        <div>
            <div class="chart-box">
                <h4>Per Scope</h4>
                <canvas id="chartScope"></canvas>
            </div>
            <div class="chart-box">
                <h4>Per Usage Status</h4>
                <canvas id="chartStatus"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
// === KONFIGURASI ===
const SHEET_ID = "1Ciq9oYizelBd85lzz4Qpyqn7q4jZDP1f6sJbI22O_QQ";
const SHEET_NAME = "Raw_File_Update"; // Ganti nama sheet jika perlu
const REFRESH_MINUTES = 3; // Auto refresh tiap berapa menit
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;

let allData = [];
let chartScope, chartStatus;

// === AMBIL DATA ===
async function fetchData() {
    try {
        document.getElementById("refreshInfo").textContent = `⏳ Mengambil data...`;
        const res = await fetch(URL);
        const txt = await res.text();
        const json = JSON.parse(txt.substr(47).slice(0, -2));

        // Konversi data
        const rows = json.table.rows;
        const cols = json.table.cols.map(c => c.label || "");
        allData = rows.map(r => {
            let obj = {};
            r.c.forEach((cell, i) => obj[cols[i] || `col${i}`] = cell?.v ?? "");
            return obj;
        });

        // Perbarui tampilan
        updateDashboard(allData);
        document.getElementById("refreshInfo").textContent = `✅ Data diperbarui: ${new Date().toLocaleString("id-ID")} · Auto-refresh tiap ${REFRESH_MINUTES} menit`;
    } catch (err) {
        console.error(err);
        document.getElementById("refreshInfo").innerHTML = `❌ Gagal ambil data. Pastikan Sheet sudah di-set publik!<br>Error: ${err.message}`;
    }
}

// === HITUNG & TAMPILKAN ===
function updateDashboard(data) {
    // Hitung ringkasan
    const total = data.length;
    const stock = data.filter(r => r["Status"]?.toString().trim().includes("Stock")).length;
    const faulty = data.filter(r => r["Status"]?.toString().trim().includes("Faulty") || r["Status"]?.toString().trim().includes("Force")).length;
    const unikPart = new Set(data.map(r => r["Part"] || r["PART"] || "")).size;
    const unikLoc = new Set(data.map(r => r["Site"] || r["SITE"] || r["Gudang"] || "")).size;

    document.getElementById("totalUnit").textContent = total;
    document.getElementById("inStock").textContent = stock;
    document.getElementById("needReplace").textContent = faulty;
    document.getElementById("typePart").textContent = unikPart;
    document.getElementById("location").textContent = unikLoc;

    // Isi filter pilihan
    const scopes = [...new Set(data.map(r => r["Scope"] || r["SCOPE"] || "").filter(v => v))].sort();
    const brands = [...new Set(data.map(r => r["Brand"] || r["BRAND"] || "").filter(v => v))].sort();
    fillSelect("filterScope", scopes);
    fillSelect("filterBrand", brands);

    // Gambar grafik
    drawCharts(data);

    // Gambar tabel
    renderTable(data);
}

// === GRAFIK ===
function drawCharts(data) {
    // Per Scope
    const scopeCount = {};
    data.forEach(r => {
        const s = (r["Scope"] || r["SCOPE"] || "Lainnya").trim();
        scopeCount[s] = (scopeCount[s] || 0) + 1;
    });
    const sLabels = Object.keys(scopeCount);
    const sValues = Object.values(scopeCount);

    if (chartScope) chartScope.destroy();
    chartScope = new Chart(document.getElementById("chartScope"), {
        type: "bar",
        data: {
            labels: sLabels,
            datasets: [{
                label: "Jumlah",
                data: sValues,
                backgroundColor: "#00d4ff",
                borderRadius: 4
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                y: { ticks: { color: "#8892a6" }, grid: { color: "#2c344b" } },
                x: { ticks: { color: "#8892a6" }, grid: { display: false } }
            }
        }
    });

    // Per Status
    const stCount = { Stock:0, Faulty:0, Force:0 };
    data.forEach(r => {
        const s = (r["Status"] || r["STATUS"] || "").toString().trim();
        if (s.includes("Stock")) stCount.Stock++;
        else if (s.includes("Faulty")) stCount.Faulty++;
        else if (s.includes("Force")) stCount.Force++;
    });

    if (chartStatus) chartStatus.destroy();
    chartStatus = new Chart(document.getElementById("chartStatus"), {
        type: "doughnut",
        data: {
            labels: ["Stock", "Replacement Faulty", "Force Majure"],
            datasets: [{
                data: [stCount.Stock, stCount.Faulty, stCount.Force],
                backgroundColor: ["#00d084", "#ffc107", "#ff5252"],
                borderWidth: 0
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { position: "bottom", labels: { color: "#e6e6e6", font: { size:12 } } } }
        }
    });
}

// === TABEL ===
function renderTable(data) {
    const search = document.getElementById("search").value.toLowerCase();
    const fScope = document.getElementById("filterScope").value;
    const fBrand = document.getElementById("filterBrand").value;
    const fStatus = document.getElementById("filterStatus").value;

    const filtered = data.filter(r => {
        const txt = Object.values(r).join(" ").toLowerCase();
        const st = (r["Status"] || r["STATUS"] || "").toString().trim();
        return (!search || txt.includes(search)) &&
               (!fScope || (r["Scope"]||r["SCOPE"]||"") === fScope) &&
               (!fBrand || (r["Brand"]||r["BRAND"]||"") === fBrand) &&
               (!fStatus || st.includes(fStatus));
    });

    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = filtered.map(r => {
        const st = (r["Status"] || r["STATUS"] || "").toString().trim();
        let cls = "";
        if (st.includes("Stock")) cls = "status-stock";
        else if (st.includes("Faulty")) cls = "status-faulty";
        else if (st.includes("Force")) cls = "status-force";

        return `<tr>
            <td>${(r["Part"] || r["PART"] || "-")}</td>
            <td>${(r["Brand"] || r["BRAND"] || "-")}</td>
            <td>${(r["Type"] || r["TYPE"] || "-")}</td>
            <td>${(r["Scope"] || r["SCOPE"] || "-")}</td>
            <td>${(r["Part Number"] || r["PART NUMBER"] || "-")}</td>
            <td>${(r["QTY"] || r["Qty"] || r["qty"] || "-")}</td>
            <td class="${cls}">${st || "-"}</td>
        </tr>`;
    }).join("");
}

function fillSelect(id, arr) {
    const sel = document.getElementById(id);
    const keep = sel.value;
    sel.innerHTML = `<option value="">Semua ${id.replace("filter","")}</option>` +
        arr.map(v => `<option value="${v}">${v}</option>`).join("");
    sel.value = keep;
}

// === PANTALAN FILTER ===
document.getElementById("search").addEventListener("input", () => renderTable(allData));
document.getElementById("filterScope").addEventListener("change", () => renderTable(allData));
document.getElementById("filterBrand").addEventListener("change", () => renderTable(allData));
document.getElementById("filterStatus").addEventListener("change", () => renderTable(allData));

// === MULAI ===
fetchData();
setInterval(fetchData, REFRESH_MINUTES * 60 * 1000);
</script>
</body>
</html>
