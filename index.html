<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stok Material — BAKTI MSS 186</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        :root {
            --bg: #0f1419;
            --bg-card: #1a1f2e;
            --bg-card-2: #21283c;
            --accent: #00d4ff;
            --green: #00d084;
            --yellow: #ffc107;
            --red: #ff5252;
            --purple: #a855f7;
            --orange: #ff9f29;
            --text: #e6e6e6;
            --muted: #8892a6;
            --border: #2c344b;
        }
        body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { margin-bottom: 24px; }
        h1 { font-size: 22px; color: var(--accent); margin-bottom: 4px; }
        .sub { color: var(--muted); font-size: 13px; }
        .refresh-info { font-size: 12px; color: var(--muted); margin-top: 6px; }

        /* === KARTU RINGKASAN — Versi SUKA KAMU + TAMBAH TOTAL STOCK === */
        .cards { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin-bottom: 24px; }
        @media (max-width: 1200px) { .cards { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 600px) { .cards { grid-template-columns: 1fr; } }
        .card {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-card-2));
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
        }
        .card h3 { font-size: 13px; color: var(--muted); margin-bottom: 8px; font-weight: 500; }
        .card .num { font-size: 28px; font-weight: 700; }

        .card:nth-child(1) .num { color: var(--accent); }     /* TOTAL UNIT */
        .card:nth-child(2) .num { color: var(--green); }       /* UNIT DI STOCK */
        .card:nth-child(3) .num { color: var(--orange); }      /* TOTAL STOCK QTY — BARU */
        .card:nth-child(4) .num { color: var(--red); }         /* PERLU PENGGANTIAN */
        .card:nth-child(5) .num { color: var(--yellow); }      /* JENIS PART */
        .card:nth-child(6) .num { color: var(--purple); }      /* SITE / GUDANG */

        /* FILTER */
        .filter-bar {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 18px;
            display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
        }
        input, select, button {
            background: var(--bg-card-2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 13px;
        }
        button { background: var(--accent); color: #000; font-weight: 600; cursor: pointer; border: none; }
        button:hover { background: #33e5ff; }

        /* GRAFIK */
        .chart-full { margin-bottom: 24px; }
        .chart-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }
        .chart-box h4 {
            font-size: 15px;
            margin-bottom: 14px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-box h4 span { font-size: 12px; color: var(--muted); font-weight: normal; }
        .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        @media (max-width: 900px) { .chart-row { grid-template-columns: 1fr; } }

        .loading { text-align: center; padding: 40px; color: var(--muted); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📦 Stok Material — BAKTI MSS 186</h1>
        <p class="sub">Sparepart Operation · Transaction Raw Data</p>
        <p class="refresh-info" id="refreshInfo">Mengambil data...</p>
    </header>

    <!-- === KARTU: Versi Sebelumnya + TAMBAH TOTAL STOCK === -->
    <div class="cards">
        <div class="card"><h3>TOTAL UNIT</h3><div class="num" id="totalUnit">—</div></div>
        <div class="card"><h3>UNIT DI STOCK</h3><div class="num" id="inStock">—</div></div>
        <div class="card"><h3>TOTAL STOCK (QTY)</h3><div class="num" id="totalStock">—</div></div>
        <div class="card"><h3>PERLU PENGGANTIAN</h3><div class="num" id="needReplace">—</div></div>
        <div class="card"><h3>JENIS PART</h3><div class="num" id="typePart">—</div></div>
        <div class="card"><h3>SITE / GUDANG</h3><div class="num" id="location">—</div></div>
    </div>

    <!-- FILTER & PENCARIAN -->
    <div class="filter-bar">
        <input type="text" id="search" placeholder="🔍 Cari Part / No. Part / Site...">
        <select id="filterScope"><option value="">Semua Scope</option></select>
        <select id="filterBrand"><option value="">Semua Brand</option></select>
        <select id="filterStatus"><option value="">Semua Status</option></select>
        <button onclick="fetchData()">🔄 Refresh</button>
    </div>

    <!-- 📈 GRAFIK: SEMUA PART YANG STATUS = STOCK -->
    <div class="chart-full">
        <div class="chart-box">
            <h4>📦 SPAREPART STOCK AVAILABILITY <span>(Hanya Usage Status = Stock)</span></h4>
            <canvas id="chartStockPart"></canvas>
        </div>
    </div>

    <!-- GRAFIK BAWAH -->
    <div class="chart-row">
        <div class="chart-box">
            <h4>📊 Per Scope</h4>
            <canvas id="chartScope"></canvas>
        </div>
        <div class="chart-box">
            <h4>🔧 Per Usage Status</h4>
            <canvas id="chartStatus"></canvas>
        </div>
    </div>
</div>

<script>
// === KONFIGURASI ===
const SHEET_ID = "1Ciq9oYizelBd85lzz4Qpyqn7q4jZDP1f6sJbI22O_QQ";
const SHEET_NAME = "Raw_File_Update"; // Ubah nama sheet jika perlu
const REFRESH_MINUTES = 3;
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;

let allData = [];
let chartStockPart, chartScope, chartStatus;

// === AMBIL DATA ===
async function fetchData() {
    try {
        document.getElementById("refreshInfo").textContent = `⏳ Mengambil data...`;
        const res = await fetch(URL);
        const txt = await res.text();
        const json = JSON.parse(txt.substr(47).slice(0, -2));

        // Kolom sesuai urutan asli
        const cols = [
            "REQUEST DATE","ALOCATION ID","ALOCATION NAME","KABUPATEN","SCOPE",
            "MATERIAL TYPE","BRAND","PART","RMA No. / PR No.","DESCRIPTION",
            "PART NUMBER","SN","QTY","UOM","REQUEST STATUS",
            "ASSET CONDITION","ORIGIN ID","ORIGIN NAME","DESTINATION ID","DESTINATION NAME",
            "INBOUND DATE","INBOUND STATUS","USAGE STATUS","CURRENT SITE ID","CURRENT SITE NAME",
            "TT BAKTI OSS","DEFECTIVE PART NUMBER","DEFECTIVE SN","INSTALLATION DATE","STATUS REPLACEMENT",
            "COVERAGE TYPE","CLAIM STATUS","CLAIM REPORT DATE","DISPOSITION METHODE","DISPOSITION DATE",
            "DEFECTIVE POSITION ID","DEFECTIVE POSITION NAME","HISTORY TRACKING REMARK"
        ];

        allData = json.table.rows.map(r => {
            let obj = {};
            r.c.forEach((cell, i) => { obj[cols[i]] = cell?.v ?? ""; });
            return obj;
        });

        updateDashboard(allData);
        document.getElementById("refreshInfo").textContent = 
            `✅ Data diperbarui: ${new Date().toLocaleString("id-ID")} · Auto-refresh tiap ${REFRESH_MINUTES} menit`;
    } catch (err) {
        console.error(err);
        document.getElementById("refreshInfo").innerHTML = 
            `❌ Gagal ambil data. Pastikan Sheet sudah di-set publik & nama Sheet benar!<br>Error: ${err.message}`;
    }
}

// === HITUNG & TAMPILKAN KARTU ===
function updateDashboard(data) {
    // 1. TOTAL UNIT = jumlah baris
    const total = data.length;

    // 2. UNIT DI STOCK = jumlah baris yang Usage Status berisi "Stock"
    const stockRows = data.filter(r => 
        (r["USAGE STATUS"] || "").toString().trim().toLowerCase().includes("stock")
    );
    const inStock = stockRows.length;

    // 3. TOTAL STOCK (QTY) = JUMLAH TOTAL QTY yang berstatus Stock ← KARTU BARU
    const totalStock = stockRows.reduce((sum, r) => sum + (Number(r["QTY"]) || 0), 0);

    // 4. PERLU PENGGANTIAN = jumlah baris Status Replacement berisi Faulty / Force
    const faulty = data.filter(r => {
        const s = (r["STATUS REPLACEMENT"] || "").toString().trim().toLowerCase();
        return s.includes("faulty") || s.includes("force");
    }).length;

    // 5. JENIS PART = jumlah nama part yang berbeda
    const unikPart = new Set(data.map(r => (r["PART"] || "").trim()).filter(v => v)).size;

    // 6. SITE / GUDANG = jumlah site yang berbeda
    const unikLoc = new Set(data.map(r => 
        (r["CURRENT SITE NAME"] || r["ALOCATION NAME"] || "").trim()
    ).filter(v => v)).size;

    // TAMPILKAN KE KARTU
    document.getElementById("totalUnit").textContent = total;
    document.getElementById("inStock").textContent = inStock;
    document.getElementById("totalStock").textContent = totalStock;
    document.getElementById("needReplace").textContent = faulty;
    document.getElementById("typePart").textContent = unikPart;
    document.getElementById("location").textContent = unikLoc;

    // Isi pilihan filter
    fillSelect("filterScope", [...new Set(data.map(r => (r["SCOPE"] || "").trim()).filter(v => v))].sort());
    fillSelect("filterBrand", [...new Set(data.map(r => (r["BRAND"] || "").trim()).filter(v => v))].sort());
    fillSelect("filterStatus", [...new Set(data.map(r => (r["USAGE STATUS"] || "").trim()).filter(v => v))].sort());

    // Gambar semua grafik
    drawStockPartChart(data);
    drawScopeChart(data);
    drawStatusChart(data);
}

// === 📈 GRAFIK: SEMUA PART YANG STATUS = STOCK ===
function drawStockPartChart(data) {
    // Filter hanya Usage Status = Stock
    const stockData = data.filter(r => 
        (r["USAGE STATUS"] || "").toString().trim().toLowerCase().includes("stock")
    );

    // Hitung QTY per Nama Part
    const partQty = {};
    stockData.forEach(r => {
        const partName = (r["PART"] || "UNKNOWN").toString().trim() || "UNKNOWN";
        const qty = Number(r["QTY"]) || 0;
        partQty[partName] = (partQty[partName] || 0) + qty;
    });

    // Urutkan dari terbanyak
    const sorted = Object.entries(partQty).sort((a, b) => b[1] - a[1]);
    const labels = sorted.map(item => item[0]);
    const values = sorted.map(item => item[1]);

    // Warna hijau
    const greenColors = values.map((_, i) => {
        const alpha = 0.4 + ((values[i] / Math.max(...values)) * 0.6);
        return `rgba(0, 208, 132, ${alpha})`;
    });

    if (chartStockPart) chartStockPart.destroy();
    chartStockPart = new Chart(document.getElementById("chartStockPart"), {
        type: "bar",
        data: {
            labels: labels,
            datasets: [{
                label: "Total QTY (Stock)",
                data: values,
                backgroundColor: greenColors,
                borderWidth: 0,
                borderRadius: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: "#1a1f2e",
                    titleColor: "#fff",
                    bodyColor: "#fff",
                    borderColor: "#00d084",
                    borderWidth: 1
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: { color: "#8892a6" },
                    grid: { color: "#2c344b" }
                },
                x: {
                    ticks: { color: "#8892a6", maxRotation: 60, minRotation: 45 },
                    grid: { display: false }
                }
            }
        }
    });
}

// === GRAFIK PER SCOPE ===
function drawScopeChart(data) {
    const scopeQty = {};
    data.forEach(r => {
        const s = (r["SCOPE"] || "Lainnya").trim() || "Lainnya";
        scopeQty[s] = (scopeQty[s] || 0) + (Number(r["QTY"]) || 0);
    });

    if (chartScope) chartScope.destroy();
    chartScope = new Chart(document.getElementById("chartScope"), {
        type: "bar",
        data: {
            labels: Object.keys(scopeQty),
            datasets: [{
                label: "Total QTY",
                data: Object.values(scopeQty),
                backgroundColor: "#00d4ff",
                borderRadius: 4
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                y: { ticks: { color: "#8892a6" }, grid: { color: "#2c344b" } },
                x: { ticks: { color: "#8892a6" }, grid: { display: false } }
            }
        }
    });
}

// === GRAFIK PER STATUS ===
function drawStatusChart(data) {
    const statusQty = {};
    data.forEach(r => {
        const s = (r["USAGE STATUS"] || "Lainnya").trim() || "Lainnya";
        statusQty[s] = (statusQty[s] || 0) + (Number(r["QTY"]) || 0);
    });

    const colors = Object.keys(statusQty).map(k => {
        const l = k.toLowerCase();
        if (l.includes("stock")) return "#00d084";
        if (l.includes("faulty")) return "#ffc107";
        if (l.includes("force")) return "#ff5252";
        return "#8892a6";
    });

    if (chartStatus) chartStatus.destroy();
    chartStatus = new Chart(document.getElementById("chartStatus"), {
        type: "doughnut",
        data: {
            labels: Object.keys(statusQty),
            datasets: [{
                data: Object.values(statusQty),
                backgroundColor: colors,
                borderWidth: 0
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { position: "bottom", labels: { color: "#e6e6e6" } } }
        }
    });
}

function fillSelect(id, arr) {
    const sel = document.getElementById(id);
    const keep = sel.value;
    sel.innerHTML = `<option value="">Semua</option>` +
        arr.map(v => `<option value="${v}">${v}</option>`).join("");
    sel.value = keep;
}

// === MULAI ===
fetchData();
setInterval(fetchData, REFRESH_MINUTES * 60 * 1000);
</script>
</body>
</html>
